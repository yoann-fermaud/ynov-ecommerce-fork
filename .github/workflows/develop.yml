name: Develop
on:
  push:
    branches: [develop]

jobs:
    tests:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24

        - name: Install dependencies
          run: npm ci

        - name: Run unit tests
          run: npm test

    coverage:
      needs: tests
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24

        - name: Install dependencies
          run: npm ci

        - name: Run tests with coverage
          run: npm run test:coverage

        - name: Upload coverage artifact
          uses: actions/upload-artifact@v4
          with:
            name: coverage-report
            path: coverage/
